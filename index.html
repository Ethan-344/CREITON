<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Casa do Outro Lado</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#08090d;
 color:white;
 font-family:Arial,sans-serif;
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:100vh;
}

#container{width:95%;max-width:1000px}

h1{text-align:center;color:#b9a9b9;letter-spacing:4px}

canvas{
 width:100%;
 background:#111;
 border:2px solid #444;
 display:block;
}

#hud{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 padding:10px;
 background:#171922;
}

.info{
 background:#292d39;
 padding:8px;
 border-radius:5px;
 font-size:13px;
}

#message{flex:1;color:#e8c78c}

#overlay{
 position:absolute;
 inset:0;
 background:rgba(0,0,0,.94);
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 padding:20px;
}

#panel{max-width:500px}

#panel h2{color:#b83240;font-size:30px}

button{
 padding:14px 25px;
 background:#9b252f;
 color:white;
 border:0;
 cursor:pointer;
 font-weight:bold;
}

#gamebox{position:relative}

</style>
</head>

<body>

<div id="container">

<h1>A CASA DO OUTRO LADO</h1>

<div id="gamebox">

<canvas id="game" width="800" height="500"></canvas>

<div id="overlay">
<div id="panel">
<h2>A CASA ESTÁ ACORDADA</h2>

<p>Você acordou em uma casa abandonada. Explore os cômodos, encontre as três chaves e escape da criatura.</p>

<p>
WASD: Movimentar<br>
E: Interagir<br>
Q: Trocar equipamento<br>
ESPAÇO: Usar equipamento
</p>

<button onclick="startGame()">ENTRAR NA CASA</button>
</div>
</div>

</div>

<div id="hud">
<div class="info" id="room">Entrada</div>
<div class="info" id="health">Vida: 100</div>
<div class="info" id="keys">Chaves: 0/3</div>
<div class="info" id="equipment">Lanterna</div>
<div class="info" id="phase">Fase: 1/4</div>
<div class="info" id="message">Encontre a saída.</div>
</div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const rooms=[

{
 name:"Entrada",
 doors:[{x:760,y:220,to:1}],
 items:[
 {x:150,y:150,type:"battery",name:"Pilha"},
 {x:300,y:350,type:"note",name:"Bilhete"}
 ]
},

{
 name:"Sala",
 doors:[
 {x:20,y:220,to:0},
 {x:760,y:220,to:2},
 {x:390,y:20,to:3}
 ],
 items:[
 {x:200,y:150,type:"pulse",name:"Pulso elétrico"},
 {x:550,y:350,type:"battery",name:"Pilha"}
 ]
},

{
 name:"Cozinha",
 doors:[
 {x:20,y:220,to:1},
 {x:760,y:220,to:4}
 ],
 items:[
 {x:200,y:320,type:"key",name:"Chave enferrujada"},
 {x:550,y:150,type:"snack",name:"Comida"}
 ]
},

{
 name:"Corredor",
 doors:[
 {x:390,y:460,to:1},
 {x:390,y:20,to:5},
 {x:760,y:220,to:6}
 ],
 items:[
 {x:600,y:350,type:"flare",name:"Sinalizador"},
 {x:180,y:180,type:"note",name:"Bilhete"}
 ]
},

{
 name:"Despensa",
 doors:[
 {x:20,y:220,to:2}
 ],
 items:[
 {x:580,y:300,type:"key",name:"Chave azul"},
 {x:250,y:140,type:"battery",name:"Pilha"}
 ]
},

{
 name:"Quarto",
 doors:[
 {x:390,y:460,to:3}
 ],
 items:[
 {x:600,y:160,type:"key",name:"Chave preta"},
 {x:180,y:330,type:"pulse",name:"Pulso elétrico"}
 ]
},

{
 name:"Escritório",
 doors:[
 {x:20,y:220,to:3},
 {x:760,y:220,to:7,locked:2}
 ],
 items:[
 {x:250,y:150,type:"note",name:"Bilhete"},
 {x:570,y:340,type:"battery",name:"Pilha"}
 ]
},

{
 name:"Porão",
 doors:[
 {x:20,y:220,to:6},
 {x:390,y:20,to:8,locked:3}
 ],
 items:[
 {x:210,y:300,type:"flare",name:"Sinalizador"},
 {x:570,y:130,type:"battery",name:"Pilha"}
 ]
},

{
 name:"Saída",
 doors:[
 {x:390,y:460,to:7}
 ],
 items:[]
}

];

// JOGADOR

let player={
 x:100,
 y:250,
 speed:3,
 health:100,
 radius:13
};

// MONSTRO

let monster={
 x:650,
 y:250,
 speed:1.3,
 radius:18,
 stun:0
};

// ESTADO DO JOGO

let currentRoom=0;
let keys=0;

let inventory={
 pulse:0,
 flare:0
};

let equipment="flash";

let collected=[];
let gameStarted=false;
let gameOver=false;
let won=false;

let cooldown=0;
let time=0;

const pressed={};

function distance(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

function message(text){
 document.getElementById("message").textContent=text;
}

function updateHUD(){

 document.getElementById("room").textContent=
 "Cômodo: "+rooms[currentRoom].name;

 document.getElementById("health").textContent=
 "Vida: "+Math.max(0,Math.floor(player.health));

 document.getElementById("keys").textContent=
 "Chaves: "+keys+"/3";

 document.getElementById("equipment").textContent=
 "Equipamento: "+
 (equipment==="flash"?"Lanterna":
 equipment==="pulse"?"Pulso elétrico":"Sinalizador");

 document.getElementById("phase").textContent=
 "Fase: "+Math.min(4,Math.max(1,Math.ceil((currentRoom+1)/2)))+"/4";
}

// INICIAR

function startGame(){

 gameStarted=true;

 document.getElementById("overlay").style.display="none";

 message("Explore a casa. Encontre as três chaves.");

 updateHUD();
}

// TROCAR DE CÔMODO

function changeRoom(door){

 currentRoom=door.to;

 if(door.x<30){
  player.x=740;
  player.y=250;
 }
 else if(door.x>740){
  player.x=60;
  player.y=250;
 }
 else if(door.y<30){
  player.x=400;
  player.y=440;
 }
 else{
  player.x=400;
  player.y=60;
 }

 // A criatura acompanha o jogador entre os cômodos.
 monster.x=player.x<400?720:80;
 monster.y=player.y<250?420:80;

 message("Você entrou em: "+rooms[currentRoom].name);

 updateHUD();
}

// INTERAÇÃO

function interact(){

 if(!gameStarted||gameOver||won)return;

 let nearest=null;
 let nearestDistance=55;

 rooms[currentRoom].items.forEach((item,index)=>{

  let id=currentRoom+"-"+index;

  if(collected.includes(id))return;

  let d=distance(player,item);

  if(d<nearestDistance){
   nearest={type:"item",item,index};
   nearestDistance=d;
  }

 });

 rooms[currentRoom].doors.forEach(door=>{

  let d=distance(player,door);

  if(d<nearestDistance){
   nearest={type:"door",door};
   nearestDistance=d;
  }

 });

 if(!nearest){
  message("Não existe nada para interagir aqui.");
  return;
 }

 if(nearest.type==="door"){

  let door=nearest.door;

  if(door.locked&&keys<door.locked){
   message("Você precisa de "+door.locked+" chaves.");
   return;
  }

  if(currentRoom===7&&door.to===8&&keys<3){
   message("Encontre as três chaves para abrir a saída.");
   return;
  }

  changeRoom(door);
  return;
 }

 let item=nearest.item;
 let id=currentRoom+"-"+nearest.index;

 collected.push(id);

 switch(item.type){

  case "key":
   keys++;
   message("Você encontrou uma chave!");
   break;

  case "pulse":
   inventory.pulse++;
   message("Pulso elétrico coletado!");
   break;

  case "flare":
   inventory.flare++;
   message("Sinalizador coletado!");
   break;

  case "battery":
   player.health=Math.min(100,player.health+10);
   message("Você encontrou uma pilha e recuperou energia.");
   break;

  case "snack":
   player.health=Math.min(100,player.health+20);
   message("Você encontrou comida e recuperou vida.");
   break;

  case "note":
   message("Bilhete: A criatura não gosta de luz forte.");
   break;
 }

 updateHUD();
}

// EQUIPAMENTOS

function useEquipment(){

 if(cooldown>0)return;

 if(equipment==="flash"){

  if(distance(player,monster)<190){
   monster.stun=2;
   message("A criatura recuou com a luz!");
  }else{
   message("Você iluminou o ambiente.");
  }

 }

 else if(equipment==="pulse"){

  if(inventory.pulse<=0){
   message("Você não possui cargas de pulso.");
   return;
  }

  inventory.pulse--;
  monster.stun=4;

  message("Pulso elétrico disparado!");
 }

 else if(equipment==="flare"){

  if(inventory.flare<=0){
   message("Você não possui sinalizadores.");
   return;
  }

  inventory.flare--;
  monster.stun=6;

  message("O sinalizador afastou a criatura!");
 }

 cooldown=0.5;

 updateHUD();
}

// CONTROLES

window.addEventListener("keydown",e=>{

 let key=e.key.toLowerCase();

 pressed[key]=true;

 if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(key)){
  e.preventDefault();
 }

 if(!gameStarted||gameOver||won)return;

 if(key==="e")interact();

 if(key===" "){
  useEquipment();
 }

 if(key==="q"){

  if(equipment==="flash")equipment="pulse";
  else if(equipment==="pulse")equipment="flare";
  else equipment="flash";

  updateHUD();

 }

});

window.addEventListener("keyup",e=>{
 pressed[e.key.toLowerCase()]=false;
});

// MOVIMENTAÇÃO

function movePlayer(){

 let dx=0;
 let dy=0;

 if(pressed.w||pressed.arrowup)dy--;
 if(pressed.s||pressed.arrowdown)dy++;
 if(pressed.a||pressed.arrowleft)dx--;
 if(pressed.d||pressed.arrowright)dx++;

 if(dx!==0||dy!==0){

  let length=Math.hypot(dx,dy);

  dx/=length;
  dy/=length;

  player.x+=dx*player.speed;
  player.y+=dy*player.speed;

 }

 player.x=Math.max(30,Math.min(770,player.x));
 player.y=Math.max(30,Math.min(470,player.y));

}

// FINAL DO JOGO

function finishGame(victory){

 gameOver=!victory;
 won=victory;

 document.getElementById("overlay").style.display="flex";

 document.getElementById("panel").innerHTML=victory?

 `<h2>VOCÊ ESCAPOU!</h2>
 <p>Você conseguiu escapar da casa. Mas será que a criatura realmente ficou para trás?</p>
 <button onclick="location.reload()">JOGAR NOVAMENTE</button>`

 :

 `<h2>A CASA TE ENCONTROU</h2>
 <p>A criatura alcançou você. A casa venceu desta vez.</p>
 <button onclick="location.reload()">TENTAR NOVAMENTE</button>`;

}

// ATUALIZAÇÃO

function update(dt){

 if(!gameStarted||gameOver||won)return;

 time+=dt;

 cooldown=Math.max(0,cooldown-dt);

 movePlayer();

 if(monster.stun>0){

  monster.stun-=dt;

 }else{

  let d=distance(player,monster);

  // A criatura persegue o jogador.

  if(d<400){

   let dx=(player.x-monster.x)/Math.max(d,1);
   let dy=(player.y-monster.y)/Math.max(d,1);

   monster.x+=dx*monster.speed;
   monster.y+=dy*monster.speed;

  }

  // Ataque da criatura.

  if(d<35){

   player.health-=20*dt;

   message("CUIDADO! A CRIATURA ESTÁ TE ATACANDO!");

  }

 }

 if(player.health<=0){
  player.health=0;
  finishGame(false);
 }

 // Verificação da saída.

 if(currentRoom===8&&player.y<80){
  finishGame(true);
 }

 updateHUD();
}

// DESENHAR CENÁRIO

function draw(){

 ctx.clearRect(0,0,800,500);

 // Ambiente

 let gradient=ctx.createRadialGradient(
  400,250,30,
  400,250,550
 );

 gradient.addColorStop(0,"#292b32");
 gradient.addColorStop(1,"#050609");

 ctx.fillStyle=gradient;
 ctx.fillRect(0,0,800,500);

 // Piso

 ctx.strokeStyle="rgba(255,255,255,.04)";

 for(let y=40;y<500;y+=40){

  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(800,y);
  ctx.stroke();

 }

 // Paredes

 ctx.fillStyle="#41404a";

 ctx.fillRect(0,0,800,12);
 ctx.fillRect(0,488,800,12);
 ctx.fillRect(0,0,12,500);
 ctx.fillRect(788,0,12,500);

 // Móveis

 ctx.fillStyle="#484047";

 if(currentRoom===2){
  ctx.fillRect(80,80,150,65);
  ctx.fillRect(520,310,150,80);
 }

 if(currentRoom===5){
  ctx.fillRect(80,100,190,90);
  ctx.fillRect(520,300,150,80);
 }

 if(currentRoom===6){
  ctx.fillRect(90,100,180,65);
  ctx.fillRect(520,320,170,65);
 }

 if(currentRoom===7){
  ctx.fillRect(90,80,130,110);
  ctx.fillRect(560,290,130,100);
 }

 // Portas

 rooms[currentRoom].doors.forEach(door=>{

  let locked=door.locked&&keys<door.locked;

  ctx.fillStyle=locked?"#702d35":"#98734e";

  ctx.fillRect(door.x-20,door.y-27,40,54);

  ctx.fillStyle="#e6c98b";

  ctx.beginPath();
  ctx.arc(door.x,door.y,4,0,Math.PI*2);
  ctx.fill();

  if(distance(player,door)<55){

   ctx.fillStyle="white";
   ctx.font="13px Arial";
   ctx.fillText(locked?"TRANCADA":"E: INTERAGIR",door.x-45,door.y-38);

  }

 });

 // Objetos

 rooms[currentRoom].items.forEach((item,index)=>{

  let id=currentRoom+"-"+index;

  if(collected.includes(id))return;

  let colors={
   key:"#e4ca54",
   pulse:"#53d8e8",
   flare:"#ed8954",
   battery:"#83bd9b",
   snack:"#b7a16d",
   note:"#ddd2bd"
  };

  ctx.fillStyle=colors[item.type]||"white";

  ctx.beginPath();
  ctx.arc(item.x,item.y,9,0,Math.PI*2);
  ctx.fill();

  if(distance(player,item)<48){

   ctx.fillStyle="white";
   ctx.font="12px Arial";
   ctx.fillText("E: "+item.name,item.x-35,item.y-18);

  }

 });

 // Criatura

 if(monster.stun<=0){

  ctx.fillStyle="#080408";

  ctx.beginPath();
  ctx.arc(monster.x,monster.y,25,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#772b38";

  ctx.beginPath();
  ctx.arc(monster.x,monster.y,18,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ffb0a5";

  ctx.fillRect(monster.x-9,monster.y-5,5,4);
  ctx.fillRect(monster.x+5,monster.y-5,5,4);

 }else{

  ctx.fillStyle="#53d8e8";

  ctx.beginPath();
  ctx.arc(monster.x,monster.y,24,0,Math.PI*2);
  ctx.fill();

 }

 // Jogador

 ctx.fillStyle="#dce2ee";

 ctx.beginPath();
 ctx.arc(player.x,player.y,13,0,Math.PI*2);
 ctx.fill();

 // Escuridão e iluminação

 ctx.save();

 ctx.fillStyle="rgba(0,0,0,.82)";
 ctx.fillRect(0,0,800,500);

 ctx.globalCompositeOperation="destination-out";

 let radius=equipment==="flash"?200:125;

 let light=ctx.createRadialGradient(
  player.x,player.y,20,
  player.x,player.y,radius
 );

 light.addColorStop(0,"rgba(0,0,0,1)");
 light.addColorStop(1,"rgba(0,0,0,0)");

 ctx.fillStyle=light;

 ctx.beginPath();
 ctx.arc(player.x,player.y,radius,0,Math.PI*2);
 ctx.fill();

 ctx.restore();

 // Controles

 ctx.fillStyle="rgba(0,0,0,.6)";
 ctx.fillRect(12,12,300,28);

 ctx.fillStyle="white";
 ctx.font="12px Arial";

 ctx.fillText("WASD: Andar | E: Interagir | Q: Equipamento | ESPAÇO: Usar",20,30);

}

// LOOP PRINCIPAL

let lastTime=0;

function gameLoop(timestamp){

 let dt=Math.min((timestamp-lastTime)/1000,0.04);

 lastTime=timestamp;

 update(dt);
 draw();

 requestAnimationFrame(gameLoop);

}

updateHUD();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
